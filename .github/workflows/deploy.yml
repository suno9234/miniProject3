name: Deploy to EC2

on:
  push:
    branches:
      - backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST_IP }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # 환경 변수 설정
          mkdir -p /home/ubuntu/app
          echo "${{ secrets.DB_ENV_VARS }}" > /home/ubuntu/app/.env
          
          # 코드 업데이트
          cd /home/ubuntu/app
          if [ ! -d ".git" ]; then
            # 첫 배포: backend 브랜치로 직접 clone
            git clone -b backend https://github.com/suno9234/miniProject3.git .
          else
            # 기존 배포: 최신 코드로 업데이트
            git fetch origin
            git checkout backend
            git reset --hard origin/backend
          fi
          
          # 기존 컨테이너 정리 및 Docker Compose 실행
          cd /home/ubuntu/app/backend
          docker compose down || true
          docker system prune -f || true
          docker compose up -d --build
          
          # 배포 상태 확인
          echo "Waiting for services to start..."
          sleep 15
          docker compose ps
          
          # 서비스 헬스체크
          echo "Checking API health..."
          curl -f http://localhost:8000 || echo "API not ready yet"