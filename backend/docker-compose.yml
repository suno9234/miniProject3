version: "3.8"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: mariadb:10.11
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    environment:
      - "discovery.type=single-node"
      - "xpack.security.enabled=false" # 개발용으로 보안 기능 비활성화
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g" # Java 힙 메모리 1GB로 설정
    ports:
      - "9200:9200" # 호스트와 컨테이너의 9200 포트 연결
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data

volumes:
  db_data:
